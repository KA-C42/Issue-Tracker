name: Test CI

on:
  pull_request:
    branches: ['main']
  # firefox + webkit e2e only, everything else already ran on the PR
  push:
    branches: ['main']

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json
            shared/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=shared/

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      - name: Export Supabase env
        run: supabase status -o env | tr -d '"' >> "$GITHUB_ENV"

      - name: Backend Vitest
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: ${{ env.DB_URL }}
          SUPABASE_AUTH_URL: ${{ env.API_URL }}/auth/v1/.well-known/jwks.json
        run: npm run test --prefix backend
 
      - name: Frontend Vitest
        if: github.event_name == 'pull_request'
        env:
          VITE_SUPABASE_URL: ${{ env.API_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.PUBLISHABLE_KEY }}
        run: npm run test:ui --prefix frontend
 
      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install --with-deps ${{ github.event_name == 'pull_request' && 'chromium' || 'firefox webkit' }}

      - name: Playwright e2e
        env:
          DATABASE_URL: ${{ env.DB_URL }}
          SUPABASE_AUTH_URL: ${{ env.API_URL }}/auth/v1/.well-known/jwks.json
          VITE_SUPABASE_URL: ${{ env.API_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.PUBLISHABLE_KEY }}
        working-directory: frontend
        # chromium on PRs, the other browsers after merge to keep PR runs fast
        run: npm run test:e2e -- ${{ github.event_name == 'pull_request' && '--project=chromium' || '--project=firefox --project=webkit' }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/